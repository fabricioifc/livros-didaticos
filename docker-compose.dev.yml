services:
  database-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["touch /data/livros.db && chown app:app /data /data/livros.db"]
    volumes:
      - ./data-dev:/data
    restart: "no"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: local-dev-only-change-me
      APP_ENV: development
      DATABASE_PATH: /data/livros.db
      PORT: "5000"
      COOKIE_SECURE: "false"
      FLASK_DEBUG: "1"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - flask
      - --app
      - acervo:create_app()
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug
    ports:
      - "5000:5000"
    volumes:
      - ./server.py:/app/server.py
      - ./acervo:/app/acervo
      - ./data-dev:/data
    init: true
