services:
  database-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["touch /data/livros.db && chown app:app /data /data/livros.db"]
    volumes:
      - ./data:/data
    restart: "no"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: local-dev-only-change-me
      DATABASE_PATH: /data/livros.db
      PORT: "5000"
      COOKIE_SECURE: "false"
      FLASK_DEBUG: "1"
      SCHOOL_YEAR: ${SCHOOL_YEAR:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
    depends_on:
      database-init:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - flask
      - --app
      - acervo:create_app()
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug
    ports:
      - "5000:5000"
    volumes:
      - ./server.py:/app/server.py
      - ./acervo:/app/acervo
      - ./data:/data
    init: true
