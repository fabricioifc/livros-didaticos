services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no arquivo .env}
      DATABASE_PATH: /data/livros.db
      PORT: "8000"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SCHOOL_YEAR: ${SCHOOL_YEAR:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./livros.db
        target: /data/livros.db
        bind:
          create_host_path: false
    init: true
