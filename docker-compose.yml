services:
  database-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["touch /data/livros.db && chown app:app /data /data/livros.db"]
    volumes:
      - ${DATA_DIR:-./data}:/data
    restart: "no"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no arquivo .env}
      DATABASE_PATH: /data/livros.db
      PORT: "8000"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SCHOOL_YEAR: ${SCHOOL_YEAR:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}:/data
    init: true
  # Backup diário do banco (cópia consistente do SQLite), em BACKUP_DIR (padrão ./backups,
  # fora do git). Fica separado de data/backups, que o app limita aos 5 mais recentes.
  backup:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "/scripts/backup.py"]
    environment:
      DATABASE_PATH: /data/livros.db
      BACKUP_DIR: /backups
      # Hora do backup em UTC: 6 = 03:00 de Brasília.
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    depends_on:
      database-init:
        condition: service_completed_successfully
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    init: true
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
